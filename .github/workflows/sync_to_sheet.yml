name: Cloud Sync Seed to Google Sheet

on:
  workflow_dispatch:
    inputs:
      gas_webhook_url:
        description: 'Google Apps Script Webhook 網址 (若已設定 Repository Secret 可留空)'
        required: false
        type: string
      target:
        description: '同步目標 (all=全部, apa=APA飯店, toyoko=東橫INN, shopping=購物藥妝, dining=美食, convenience=超商)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - apa
          - toyoko
          - shopping
          - dining
          - convenience

jobs:
  sync:
    name: Sync Data to Google Sheet
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Push Data to Google Sheet
        env:
          INPUT_URL: ${{ inputs.gas_webhook_url }}
          ENV_URL: ${{ secrets.GAS_WEBHOOK_URL || vars.GAS_WEBHOOK_URL }}
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          TARGET_URL="${INPUT_URL:-$ENV_URL}"
          if [ -z "$TARGET_URL" ]; then
            echo "::error::未提供 GAS_WEBHOOK_URL！請在執行時輸入或至 Settings -> Secrets 設定 GAS_WEBHOOK_URL。"
            exit 1
          fi
          node scripts/sync_to_sheet.js "$TARGET_URL" --target="$TARGET"

