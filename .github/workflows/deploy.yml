name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Data from Google Sheets or Seeds
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          GID: ${{ vars.GID }}
          GID_HOTEL: ${{ vars.GID_HOTEL }}
          GID_FOOD: ${{ vars.GID_FOOD }}
          GID_CONVENIENCE: ${{ vars.GID_CONVENIENCE }}
          GID_SHOPPING: ${{ vars.GID_SHOPPING }}
        run: npm run generate

      - name: Build Static Web App
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
